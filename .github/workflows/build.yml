name: Build mod jar

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Install Gradle 2.14.1
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-2.14.1-bin.zip -o gradle.zip
          unzip -q gradle.zip -d "$HOME"
          echo "$HOME/gradle-2.14.1/bin" >> "$GITHUB_PATH"

      - name: Build
        run: gradle setupCIWorkspace build --no-daemon --stacktrace

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: MazeSolver-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
